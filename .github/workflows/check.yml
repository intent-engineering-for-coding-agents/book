name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install site dependencies
        run: npm ci
      - name: Check front matter
        run: npm run docs:check-frontmatter
      - name: Check docs index
        run: npm run docs:check-index
      - name: Build site
        run: npm run docs:build
